name: Build & Deploy

on:
  push:
    branches:
      - "**"      # build on any branch
    tags:
      - "v*"      # deploy on version tags like v1.0.0

permissions:
  contents: read
  packages: write

jobs:
  build_push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB_TOKEN }}

      # Optional but nice: normalize tag for branches and tags
      - name: Set image tag
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"      # e.g. v1.2.3
          else
            TAG="${GITHUB_REF_NAME}"            # branch name
            TAG="${TAG//\//-}"                  # replace / with -
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build & push PHP image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ezfolio-php"
          docker build -f docker/Dockerfile.php -t "$IMAGE:${{ steps.vars.outputs.tag }}" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ steps.vars.outputs.tag }}"
          docker push "$IMAGE:${{ github.sha }}"
          # Only main + tags get latest
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF}" == refs/tags/* ]]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Build & push Nginx image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ezfolio-nginx"
          docker build -f docker/Dockerfile.nginx -t "$IMAGE:${{ steps.vars.outputs.tag }}" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:${{ steps.vars.outputs.tag }}"
          docker push "$IMAGE:${{ github.sha }}"
          # Only main + tags get latest
          if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF}" == refs/tags/* ]]; then
            docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  deploy:
    needs: build_push
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: SSH deploy (pull + up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            /opt/infra/auto-deployment.sh ezfolio up
