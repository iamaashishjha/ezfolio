name: Build & Deploy

on:
  push:
    branches:
      - "**"      # build on any branch
    tags:
      - "v*"      # deploy on version tags like v1.0.0

permissions:
  contents: read
  packages: write

jobs:
  build_push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"      # e.g. v1.2.3
          else
            TAG="${GITHUB_REF_NAME}"            # branch name
            TAG="${TAG//\//-}"                  # replace / with -
          fi
          SHA_TAG="sha-${GITHUB_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$SHA_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT_GITHUB_TOKEN }}

      # -------------------------
      # Build & push PHP image
      # -------------------------
      - name: Build & push PHP image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.php
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezfolio-php:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/ezfolio-php:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag & push PHP latest (main/tags only)
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ezfolio-php"
          docker pull "$IMAGE:${{ steps.vars.outputs.sha_tag }}"
          docker tag  "$IMAGE:${{ steps.vars.outputs.sha_tag }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      # -------------------------
      # Build & push Nginx image
      # -------------------------
      - name: Build & push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.nginx
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ezfolio-nginx:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/ezfolio-nginx:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag & push Nginx latest (main/tags only)
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/ezfolio-nginx"
          docker pull "$IMAGE:${{ steps.vars.outputs.sha_tag }}"
          docker tag  "$IMAGE:${{ steps.vars.outputs.sha_tag }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

  deploy:
    needs: build_push
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: SSH deploy (pull + up)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          request_pty: true
          # IMPORTANT: allow slow pulls
          timeout: 120s               # SSH connection timeout
          command_timeout: 60m        # script runtime timeout
          script: |
            /opt/infra/auto-deployment.sh ezfolio up
