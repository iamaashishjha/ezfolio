server {
  listen 80;
  server_name _;

  root /var/www/html/public;
  index index.php index.html;

  

  client_max_body_size 50m;

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  # Media objects are streamed through Laravel (Storage disk), not served as static files.
  # Use ^~ so this block wins over the static extension regex below.
  location ^~ /media/ {
    try_files $uri /index.php?$query_string;
  }

  location ~ ^/index\.php(/|$) {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    # Forward proxy headers as received from the upstream proxy (Traefik / Cloudflare).
    # Avoid appending container/internal IPs here.
    fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
    fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
    fastcgi_param HTTP_X_REAL_IP $http_x_real_ip;
    fastcgi_param HTTP_CF_CONNECTING_IP $http_cf_connecting_ip;
    fastcgi_param HTTP_TRUE_CLIENT_IP $http_true_client_ip;
    fastcgi_param HTTP_CF_PSEUDO_IPV4 $http_cf_pseudo_ipv4;
    fastcgi_pass ezfolio_php:9000;
    fastcgi_read_timeout 180;
  }

  location ^~ /storage/ {
    alias /var/www/html/storage/app/public/;
    try_files $uri =404;
    access_log off;
    expires 7d;
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
    add_header Access-Control-Allow-Headers '*' always;

    if ($request_method = 'OPTIONS') {
      add_header Access-Control-Allow-Origin * always;
      add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
      add_header Access-Control-Allow-Headers '*' always;
      add_header Content-Type 'text/plain charset=UTF-8' always;
      add_header Content-Length 0 always;
      return 204;
    }
  }

  location ~* \.(jpg|jpeg|png|gif|css|js|ico|svg|woff|woff2|ttf)$ {
    expires 7d;
    access_log off;
    try_files $uri =404;
  }

  location ~ /\.(?!well-known).* {
    deny all;
  }
}
