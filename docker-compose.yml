services:
  php:
    image: ghcr.io/iamaashishjha/ezfolio:latest
    container_name: portfolio-php
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - storage:/var/www/storage
      - /opt/apps/portfolio/.env:/var/www/.env:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"

  nginx:
    image: nginx:alpine
    container_name: portfolio-web
    restart: unless-stopped
    depends_on:
      - php
    networks:
      - internal
      - proxy
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - storage:/var/www/storage
    labels:
      - "traefik.enable=true"

      # Change domain here:
      - "traefik.http.routers.portfolio.rule=Host(`aashishjha.com.np`) || Host(`www.aashishjha.com.np`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=le"

      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

networks:
  internal:
    driver: bridge
  proxy:
    external: true

volumes:
  storage:
